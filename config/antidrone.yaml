drone_engine_file: "./models/antidronev5.engine"

detector_option: "yolo"  # "yolo" or "uav"

# yolo_option: true
# uav_option: false

T_camera2gimbal: [ 0.0,  0.0, 1.0, 0.08915, 
                  -1.0,  0.0, 0.0,  0.0150, 
                   0.0, -1.0, 0.0,  0.0215, 
                   0.0,  0.0, 0.0,     1.0]

com_port: "/dev/gimbal"

##########laser参数 (相机坐标系, 米)##########
# 初始
# laser_offset: [0.03362045536, -0.00319075302, 0]
# laser_direction: [-0.00468723, -0.00218884, 0.99998662]

# 27m
laser_offset: [0.03362045536, -0.02409075302, 0]
laser_direction: [-0.00538723, 0.00038884, 0.99998662]


##########camera参数##########
camera_name: "hikrobot_sn"
exposure_ms: 1
gain: 23.981199
vid_pid: "2bdf:0001"
serial_number: "DA8290713"

# 重投影误差: 0.1792px
camera_matrix: [31754.00911263084, 0, 1532.0162245567647, 0, 32616.686243747587, 1046.6393031900541, 0, 0, 1]
distort_coeffs: [0.52339467406775086, 43.115297379766723, 0.00078266127498807922, -0.010255957344478761, 0.14553043546298375]

rotation_angle: 0

record_video: false

start_check: false

##########扫描参数##########
scan_option: true

# 目标丢失超时保护: 未检测到目标超过此时间(秒)后才交由电控扫描
target_lost_timeout_s: 1.0

scan_center_yaw_deg: 17
scan_center_pitch_deg: 3.5
scan_yaw_step_deg: 0.05
scan_pitch_step_deg: 1
scan_cols: 400
scan_rows: 5
scan_timeout_ms: 1000

##########∞形扫描参数 (Lissajous 1:2)##########
inf_scan_center_yaw_deg: 26
inf_scan_center_pitch_deg: 4
inf_scan_amp_yaw_deg: 15
inf_scan_amp_pitch_deg: 10
inf_scan_period_s: 10.0             # ∞ 扫描周期 [秒]
inf_scan_phase_deg: 45
inf_scan_timeout_ms: 1000

##########跟踪器Kalman滤波器参数##########
tracker_q_yaw: 0.0035
tracker_q_pitch: 0.23
tracker_r_yaw: 0.00003
tracker_r_pitch: 0.000003
tracker_calculating_delay: 0.02
tracker_excuting_delay: 0.018
tracker_adjust_delay: -0.0